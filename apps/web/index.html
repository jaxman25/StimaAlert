<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The map tile that paints first is the page's LCP; warm the connection
         while React is still booting so it isn't paying for TLS. -->
    <link rel="preload" as="image" href="/map-poster.webp" />
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" crossorigin />
    <meta name="theme-color" content="#001E49" />
    <meta name="description" content="Real-time, estate-level power and internet outage map for Kenya." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StimaAlert — Kenya Outage Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
